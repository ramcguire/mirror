[package]
name = "mirrorvol-itest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Integration tests exercising mirrorvol's CRDs and controller logic against a real Kubernetes API server (KinD) — see kind/ and Taskfile.yml at the repo root."

[dependencies]
mirrorvol-api = { workspace = true }
mirrorvol-backend = { workspace = true }
mirrorvol-controller = { workspace = true }
kube = { workspace = true }
k8s-openapi = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tempfile = { workspace = true }
