# Test fixture — installs the sig-storage reference `csi-driver-host-path`
# plugin as the underlying driver `mirrorvol-csi` wraps in `task test:csi`.
# Not a dependency of `mirrorvol-csi` itself (any node-local CSI driver
# works); applied only via `task csi:install-test-driver`.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: csi-hostpath-test-driver
  namespace: mirrorvol
  labels:
    app.kubernetes.io/name: csi-hostpath-test-driver
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: csi-hostpath-test-driver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: csi-hostpath-test-driver
    spec:
      # Same candidate-node restriction as syncthing/daemonset.yaml — no
      # point running on the control-plane node mirrorvol never schedules
      # onto.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: mirrorvol.io/candidate
                    operator: Exists
      containers:
        - name: hostpath
          image: registry.k8s.io/sig-storage/hostpathplugin:v1.17.1
          args:
            - "--drivername=csi-hostpath"
            - "--v=5"
            - "--endpoint=$(CSI_ENDPOINT)"
            - "--nodeid=$(KUBE_NODE_NAME)"
          env:
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /csi
              name: socket-dir
            - mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
              name: mountpoint-dir
            - mountPath: /csi-data-dir
              name: csi-data-dir
            - mountPath: /dev
              name: dev-dir
      volumes:
        - hostPath:
            path: /var/lib/kubelet/plugins/csi-hostpath
            type: DirectoryOrCreate
          name: socket-dir
        - hostPath:
            path: /var/lib/kubelet/pods
            type: DirectoryOrCreate
          name: mountpoint-dir
        - hostPath:
            path: /srv/mirrorvol/data
            type: DirectoryOrCreate
          name: csi-data-dir
        - hostPath:
            path: /dev
            type: Directory
          name: dev-dir
