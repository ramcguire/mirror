[workspace]
resolver = "2"
members = ["crates/*", "tests/mirrorvol-itest"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

# Shared dependency versions, pinned once here so every crate stays in lockstep
# instead of drifting per-Cargo.toml. Individual crates still opt in to only
# the features they need.
[workspace.dependencies]
mirrorvol-api = { path = "crates/mirrorvol-api" }
mirrorvol-backend = { path = "crates/mirrorvol-backend" }
mirrorvol-agent = { path = "crates/mirrorvol-agent" }
mirrorvol-controller = { path = "crates/mirrorvol-controller" }
clap = { version = "4", features = ["derive"] }
serde_yaml = "0.9"

tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
protoc-bin-vendored = "3"
tower = "0.5"
tokio-stream = { version = "0.1", features = ["net"] }
hyper-util = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

kube = { version = "0.98", features = ["derive", "runtime", "client"] }
http = "1"
k8s-openapi = { version = "0.24", features = ["v1_31", "schemars"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
anyhow = "1"
parking_lot = "0.12"
walkdir = "2"

# dev-dependencies shared across crates
wiremock = "0.6"
tempfile = "3"
