# The Syncthing DaemonSet plus its co-located mirrorvol-agent sidecar.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mirrorvol-syncthing
  namespace: mirrorvol
  labels:
    app.kubernetes.io/name: mirrorvol-syncthing
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mirrorvol-syncthing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mirrorvol-syncthing
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: mirrorvol.io/candidate
                    operator: Exists
      serviceAccountName: mirrorvol-agent
      initContainers:
        - name: provision
          image: mirrorvol/agent:dev
          imagePullPolicy: IfNotPresent
          args:
            - provision
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUST_LOG
              value: info
          volumeMounts:
            - name: shared-apikey
              mountPath: /shared
        - name: force-standby
          image: busybox:1.36
          command:
            - sh
            - -ec
            - >-
              test ! -f /var/syncthing/config/config.xml ||
              sed -i 's/type="sendreceive"/type="receiveonly"/g'
              /var/syncthing/config/config.xml
          volumeMounts:
            - name: syncthing-config
              mountPath: /var/syncthing/config
      containers:
        - name: syncthing
          image: syncthing/syncthing:latest
          ports:
            - name: gui
              containerPort: 8384
              protocol: TCP
            - name: sync-tcp
              containerPort: 22000
              protocol: TCP
            - name: sync-udp
              containerPort: 22000
              protocol: UDP
            - name: discovery
              containerPort: 21027
              protocol: UDP
          command:
            - sh
            - "-c"
          args:
            - >-
              export STGUIAPIKEY="$(cat /shared/apikey)";
              exec /bin/syncthing
          env:
            - name: PUID
              value: "0"
            - name: PGID
              value: "0"
            - name: STGUIADDRESS
              value: "127.0.0.1:8384"
            - name: STNOUPGRADE
              value: "1"
          volumeMounts:
            - name: syncthing-config
              mountPath: /var/syncthing/config
            - name: mirror-data
              mountPath: /data
            - name: shared-apikey
              mountPath: /shared
              readOnly: true
          readinessProbe:
            exec: &probe
              command:
                - wget
                - "-q"
                - "-O"
                - /dev/null
                - http://127.0.0.1:8384/rest/noauth/health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: *probe
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: mirrorvol-agent
          image: mirrorvol/agent:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SYNCTHING_BASE_URL
              value: "http://localhost:8384"
            - name: SYNCTHING_API_KEY_FILE
              value: "/shared/apikey"
            - name: MIRRORVOL_DATA_ROOT
              value: "/data"
            - name: MIRRORVOL_CONSISTENCY_DIR
              value: "/shared-consistency"
            - name: MIRRORVOL_CONFLICT_DETECTION
              value: "filesystem"
            - name: RUST_LOG
              value: info
          volumeMounts:
            - name: mirror-data
              mountPath: /data
            - name: shared-apikey
              mountPath: /shared
              readOnly: true
            - name: shared-consistency
              mountPath: /shared-consistency
        # --- mirrorvol-csi overlay driver + its standard sidecars ---
        - name: mirrorvol-csi
          image: mirrorvol/csi:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SYNCTHING_BASE_URL
              value: "http://localhost:8384"
            # Same _FILE fallback as the mirrorvol-agent container above
            - name: SYNCTHING_API_KEY_FILE
              value: "/shared/apikey"
            - name: MIRRORVOL_CONSISTENCY_DIR
              value: "/shared-consistency"
            - name: RUST_LOG
              value: info
          volumeMounts:
            - name: csi-socket-dir
              mountPath: /csi
            - name: shared-consistency
              mountPath: /shared-consistency
              readOnly: true
            - name: kubelet-plugins-dir
              mountPath: /var/lib/kubelet/plugins
            - name: shared-apikey
              mountPath: /shared
              readOnly: true
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.17.0
          args:
            - --v=5
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/mirrorvol.csi.homelab.internal/csi.sock
          volumeMounts:
            - name: csi-socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
          args:
            - -v=5
            - --csi-address=/csi/csi.sock
            - --node-deployment
            - --node-deployment-immediate-binding=false
            - --leader-election=false
            - --extra-create-metadata
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: csi-socket-dir
              mountPath: /csi
      volumes:
        - name: shared-apikey
          emptyDir: {}
        - name: shared-consistency
          emptyDir: {}
        - name: syncthing-config
          hostPath:
            path: /srv/mirrorvol/syncthing-config
            type: DirectoryOrCreate
        - name: mirror-data
          hostPath:
            path: /srv/mirrorvol/data
            type: DirectoryOrCreate
        - name: csi-socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/mirrorvol.csi.homelab.internal
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: kubelet-plugins-dir
          hostPath:
            path: /var/lib/kubelet/plugins
            type: Directory
