# The Syncthing DaemonSet plus its co-located mirrorvol-agent sidecar.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mirrorvol-syncthing
  namespace: mirrorvol
  labels:
    app.kubernetes.io/name: mirrorvol-syncthing
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mirrorvol-syncthing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mirrorvol-syncthing
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: mirrorvol.io/candidate
                    operator: Exists
      serviceAccountName: mirrorvol-agent
      initContainers:
        - name: provision
          image: mirrorvol/agent:dev
          imagePullPolicy: IfNotPresent
          args:
            - provision
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Enables provisioning the shared rsync module secret. Remove
            # for a Syncthing-only deployment.
            - name: RSYNC_SECRET_FILE
              value: "/shared-rsync/secret"
            # Enables provisioning this node's own rsync device identity
            # token — distinct file from RSYNC_SECRET_FILE above: "are you
            # allowed to connect" (shared) vs. "which device is this"
            # (per-node).
            - name: RSYNC_IDENTITY_FILE
              value: "/shared-rsync/identity"
            - name: RUST_LOG
              value: info
          volumeMounts:
            - name: shared-apikey
              mountPath: /shared
            - name: shared-rsync
              mountPath: /shared-rsync
        - name: force-standby
          image: busybox:1.36
          command:
            - sh
            - -ec
            - >-
              test ! -f /var/syncthing/config/config.xml ||
              sed -i 's/type="sendreceive"/type="receiveonly"/g'
              /var/syncthing/config/config.xml
          volumeMounts:
            - name: syncthing-config
              mountPath: /var/syncthing/config
      containers:
        - name: syncthing
          image: syncthing/syncthing:latest
          ports:
            - name: gui
              containerPort: 8384
              protocol: TCP
            - name: sync-tcp
              containerPort: 22000
              protocol: TCP
            - name: sync-udp
              containerPort: 22000
              protocol: UDP
            - name: discovery
              containerPort: 21027
              protocol: UDP
          command:
            - sh
            - "-c"
          args:
            - >-
              export STGUIAPIKEY="$(cat /shared/apikey)";
              exec /bin/syncthing
          env:
            - name: PUID
              value: "0"
            - name: PGID
              value: "0"
            - name: STGUIADDRESS
              value: "127.0.0.1:8384"
            - name: STNOUPGRADE
              value: "1"
          volumeMounts:
            - name: syncthing-config
              mountPath: /var/syncthing/config
            - name: mirror-data
              mountPath: /data
            - name: shared-apikey
              mountPath: /shared
              readOnly: true
          readinessProbe:
            exec: &probe
              command:
                - wget
                - "-q"
                - "-O"
                - /dev/null
                - http://127.0.0.1:8384/rest/noauth/health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: *probe
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: mirrorvol-agent
          image: mirrorvol/agent:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SYNCTHING_BASE_URL
              value: "http://localhost:8384"
            - name: SYNCTHING_API_KEY_FILE
              value: "/shared/apikey"
            - name: MIRRORVOL_DATA_ROOT
              value: "/data"
            - name: MIRRORVOL_CONSISTENCY_DIR
              value: "/shared-consistency"
            - name: MIRRORVOL_CONFLICT_DETECTION
              value: "filesystem"
            # Enables the rsync backend; pulls always route through the
            # stunnel sidecar below once this is set.
            - name: RSYNC_SECRET_FILE
              value: "/shared-rsync/secret"
            # This node's own rsync device identity token, written by the
            # provision initContainer above — used as BackendNode.status.deviceId
            # instead of the node name.
            - name: RSYNC_IDENTITY_FILE
              value: "/shared-rsync/identity"
            - name: RSYNC_DAEMON_CONFIG_FILE
              value: "/etc/rsyncd.d/rsyncd.conf"
            - name: RUST_LOG
              value: info
          volumeMounts:
            - name: mirror-data
              mountPath: /data
            - name: shared-apikey
              mountPath: /shared
              readOnly: true
            - name: shared-consistency
              mountPath: /shared-consistency
            - name: shared-rsync
              mountPath: /shared-rsync
            - name: rsyncd-conf
              mountPath: /etc/rsyncd.d
        # rsync daemon, loopback-only — stunnel below is the only reachable
        # entry point. Waits for mirrorvol-agent to write the module list.
        - name: rsyncd
          image: mirrorvol/rsyncd:dev
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - >-
              until [ -f /etc/rsyncd.d/rsyncd.conf ]; do sleep 1; done;
              exec rsync --daemon --no-detach --port=873 --address=127.0.0.1
              --config=/etc/rsyncd.d/rsyncd.conf
          # tcpSocket probes connect from the kubelet, outside the Pod's
          # network namespace — they can never reach a loopback-only bind.
          # exec runs inside the container itself instead.
          readinessProbe:
            exec:
              command: ["nc", "-z", "127.0.0.1", "873"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: mirror-data
              mountPath: /data
              readOnly: true
            - name: rsyncd-conf
              mountPath: /etc/rsyncd.d
              readOnly: true
        # TLS-terminating sidecar in front of rsyncd — the only reachable
        # rsync entry point. Authenticated by TLS-PSK, reusing rsyncd's own
        # secret.psk file.
        - name: stunnel
          image: mirrorvol/rsyncd:dev
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - >-
              until [ -f /shared-rsync/secret.psk ]; do sleep 1; done;
              printf 'foreground = yes\npid =\n\n[mirrorvol]\naccept = 0.0.0.0:8873\nconnect = 127.0.0.1:873\nPSKsecrets = /shared-rsync/secret.psk\n'
              > /tmp/stunnel.conf;
              exec stunnel /tmp/stunnel.conf
          ports:
            - name: rsync-tls
              containerPort: 8873
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: rsync-tls
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: shared-rsync
              mountPath: /shared-rsync
              readOnly: true
        # --- mirrorvol-csi overlay driver + its standard sidecars ---
        - name: mirrorvol-csi
          image: mirrorvol/csi:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SYNCTHING_BASE_URL
              value: "http://localhost:8384"
            # Same _FILE fallback as the mirrorvol-agent container above
            - name: SYNCTHING_API_KEY_FILE
              value: "/shared/apikey"
            # Used for the attach-time pull-verify; this container never
            # runs rsyncd itself, so no RSYNC_DAEMON_CONFIG_FILE.
            - name: RSYNC_SECRET_FILE
              value: "/shared-rsync/secret"
            - name: MIRRORVOL_CONSISTENCY_DIR
              value: "/shared-consistency"
            - name: RUST_LOG
              value: info
          volumeMounts:
            - name: csi-socket-dir
              mountPath: /csi
            # Same real replica data mirrorvol-agent operates on (see that
            # container's own mirror-data mount above) — node.rs's
            # verify_local_writer needs to read the real lock file at
            # whatever real path mirrorvol.io/resolvedPath names (typically
            # /data/<id>) once underlyingPathTemplate resolved one; without
            # this mount that path is simply empty/nonexistent from this
            # container's own filesystem view, regardless of how correctly
            # it was resolved.
            - name: mirror-data
              mountPath: /data
              readOnly: true
            - name: shared-consistency
              mountPath: /shared-consistency
              readOnly: true
            - name: kubelet-plugins-dir
              mountPath: /var/lib/kubelet/plugins
              # Without this, a bind-mount kubelet/the underlying driver
              # creates *after* this Pod started (i.e. every real
              # NodeStageVolume call for a volume attached later) never
              # becomes visible inside this container — this hostPath mount
              # would just show its empty pre-mount state. verify_local_writer's
              # lock_state check (node.rs) reads real files under here (via
              # the underlying driver's staging_target_path); without this,
              # it always reads Absent regardless of the real on-disk state.
              mountPropagation: HostToContainer
            - name: shared-apikey
              mountPath: /shared
              readOnly: true
            - name: shared-rsync
              mountPath: /shared-rsync
              readOnly: true
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.17.0
          args:
            - --v=5
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/mirrorvol.csi.homelab.internal/csi.sock
          volumeMounts:
            - name: csi-socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
          args:
            - -v=5
            - --csi-address=/csi/csi.sock
            - --node-deployment
            - --node-deployment-immediate-binding=false
            - --leader-election=false
            - --extra-create-metadata
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: csi-socket-dir
              mountPath: /csi
      volumes:
        - name: shared-apikey
          emptyDir: {}
        - name: shared-consistency
          emptyDir: {}
        - name: shared-rsync
          emptyDir: {}
        - name: rsyncd-conf
          emptyDir: {}
        - name: syncthing-config
          hostPath:
            path: /srv/mirrorvol/syncthing-config
            type: DirectoryOrCreate
        - name: mirror-data
          hostPath:
            path: /srv/mirrorvol/data
            type: DirectoryOrCreate
        - name: csi-socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/mirrorvol.csi.homelab.internal
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: kubelet-plugins-dir
          hostPath:
            path: /var/lib/kubelet/plugins
            type: Directory
